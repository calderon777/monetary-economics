<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Persona Debate Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .login-container h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .login-container p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            text-align: left;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: #d32f2f;
            margin-top: 15px;
            display: none;
            font-size: 0.95rem;
        }

        .app-container {
            width: 100%;
            min-height: 100vh;
            background: white;
            display: none;
        }

        .app-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .app-header h1 {
            margin-bottom: 5px;
        }

        .app-header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .app-content {
            padding: 20px;
        }

        iframe {
            border: none;
            width: 100%;
            display: block;
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #d32f2f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            z-index: 1000;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: #b71c1c;
        }

        @media (max-width: 600px) {
            .login-container {
                padding: 30px 20px;
            }

            .login-container h1 {
                font-size: 1.5em;
            }

            .logout-btn {
                top: 10px;
                right: 10px;
                padding: 8px 16px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-container" id="loginContainer">
        <h1>🏆 AI Debate Lab</h1>
        <p>Classical vs Keynesian Economics<br><em>Access the interactive debate platform</em></p>
        
        <div class="input-group">
            <label for="password">Enter Password:</label>
            <input 
                type="password" 
                id="password" 
                placeholder="••••••••" 
                autocomplete="off"
            >
        </div>
        
        <button class="login-btn" onclick="checkPassword()">Access Debate Lab</button>
        
        <div class="error-message" id="errorMessage">
            ❌ Incorrect password. Try again.
        </div>
    </div>

    <!-- App Screen -->
    <div class="app-container" id="appContainer">
        <button class="logout-btn" onclick="logout()">🚪 Exit</button>
        
        <div class="app-header">
            <h1>🏆 AI Persona Debate: Classicals vs Keynesians</h1>
            <p>Interactive Economics Debate Platform</p>
        </div>
        
        <div class="app-content">
            <iframe 
                src="https://huggingface.co/spaces/camcalderon777/ai-persona-debate/embed" 
                frameborder="0" 
                width="100%" 
                height="1400"
                title="AI Persona Debate Lab"
            ></iframe>
        </div>
    </div>

    <script>
        // Check if already logged in
        window.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('debateLabAccess') === 'granted') {
                showApp();
            }
        });

        // Allow Enter key to submit password
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('password');
            if (passwordInput) {
                passwordInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        checkPassword();
                    }
                });
            }
        });

        function checkPassword() {
            const password = document.getElementById('password').value;
            const correctPassword = 'camcamcool';
            const errorMessage = document.getElementById('errorMessage');
            
            if (password === correctPassword) {
                errorMessage.style.display = 'none';
                localStorage.setItem('debateLabAccess', 'granted');
                showApp();
                // Clear password field
                document.getElementById('password').value = '';
            } else {
                errorMessage.style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }

        function showApp() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
        }

        function logout() {
            if (confirm('Are you sure you want to exit?')) {
                localStorage.removeItem('debateLabAccess');
                document.getElementById('appContainer').style.display = 'none';
                document.getElementById('loginContainer').style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }

        // Clear app cache when exiting
        window.addEventListener('beforeunload', function() {
            // Optional: Clear any session storage
            sessionStorage.clear();
        });
    </script>
</body>
</html>
